<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --ink:{{INK}}; --ink2:{{INK2}}; --rule:{{RULE}}; --bone:{{BONE}}; --dim:{{DIM}};
  --hot:{{HOT}}; --ok:{{OK}};
  --display:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",Impact,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--bone);font-family:var(--mono);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 62% 50%,transparent 45%,rgba(0,0,0,.55) 100%)}
.flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:var(--hot);opacity:0}
.flash.go{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:.16}100%{opacity:0}}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.hud i{position:absolute;width:22px;height:22px;border:1px solid var(--dim);opacity:.6}
.hud .tl{top:18px;left:18px;border-right:0;border-bottom:0}.hud .tr{top:18px;right:18px;border-left:0;border-bottom:0}
.hud .bl{bottom:18px;left:18px;border-right:0;border-top:0}.hud .br{bottom:18px;right:18px;border-left:0;border-top:0}
.hud span{position:absolute;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.hud .l1{top:22px;left:52px}.hud .l2{top:22px;right:52px;color:var(--bone);pointer-events:auto;cursor:pointer}
.hud .l3{top:22px;left:50%;transform:translateX(-50%);color:var(--hot);opacity:0;transition:opacity .3s}
.hud .l3.on{opacity:1}
.prog{position:fixed;left:0;top:0;height:2px;background:var(--hot);z-index:5;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.nav{position:fixed;right:52px;bottom:24px;z-index:6;display:flex;gap:7px;align-items:center}
.nav button{width:22px;height:14px;background:none;border:0;cursor:pointer;position:relative;padding:0}
.nav button:before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--rule);transition:background .3s,top .3s,height .3s}
.nav button:hover:before{background:var(--dim)}
.nav button.on:before{background:var(--hot);top:4px;height:6px}
.slide{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;
  padding:9vh 6vw;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
.slide.on{opacity:1;visibility:visible;transition:opacity .45s .1s,visibility 0s}
.col{width:min(40vw,560px);pointer-events:auto}
.slide.right .col{margin-left:auto}
.no{font-family:var(--display);font-weight:800;font-size:clamp(4rem,11vw,9rem);line-height:.8;color:transparent;
  -webkit-text-stroke:1px var(--rule);letter-spacing:-.03em;margin-bottom:.1em}
.kick{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--hot);margin-bottom:1.1em;display:flex;gap:.9em;align-items:center}
.kick:before{content:"";width:34px;height:1px;background:var(--hot);transform-origin:left;transform:scaleX(0);transition:transform .8s .2s cubic-bezier(.2,.8,.2,1)}
.slide.on .kick:before{transform:none}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:-.015em}
h1{font-size:clamp(3.2rem,9vw,8rem)}
h2{font-size:clamp(2.1rem,4.8vw,4.2rem);margin-bottom:.45em}
h1 em,h2 em{font-style:normal;color:var(--hot)}
.ln{display:block;overflow:hidden;padding:.04em 0 .08em}
.ln>span{display:block;transform:translateY(112%);transition:transform .95s cubic-bezier(.2,.8,.2,1)}
.slide.on .ln>span{transform:none}
p{font-size:clamp(.82rem,1.15vw,1rem);line-height:1.65;color:var(--bone);opacity:.82;max-width:46ch}
p b{color:var(--bone);font-weight:600;opacity:1}
p.note{margin-top:1.2em;color:var(--dim);opacity:1;font-size:clamp(.72rem,.95vw,.85rem)}
dl{margin-top:1.4em;border-top:1px solid var(--rule)}
dl div{display:grid;grid-template-columns:8.5em 1fr;gap:1em;padding:.7em 0;border-bottom:1px solid var(--rule);font-size:clamp(.74rem,1vw,.9rem)}
dt{color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-size:.82em}
dd{color:var(--bone);line-height:1.45}
dd b{color:var(--hot);font-weight:600}
.stats{display:flex;gap:2.4vw;margin-top:1.6em;flex-wrap:wrap}
.stats div{border-left:2px solid var(--rule);padding-left:1em}
.stats .v{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.4vw,3rem);line-height:1;font-variant-numeric:tabular-nums}
.stats .k{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:.4em}
.ok{color:var(--ok)}.hot{color:var(--hot)}
.rv>*{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.slide.on .rv>*{opacity:1;transform:none}
.slide.on .rv>*:nth-child(1){transition-delay:.2s}.slide.on .rv>*:nth-child(2){transition-delay:.32s}
.slide.on .rv>*:nth-child(3){transition-delay:.46s}.slide.on .rv>*:nth-child(4){transition-delay:.6s}
.slide.on .rv>*:nth-child(5){transition-delay:.74s}.slide.on .rv>*:nth-child(6){transition-delay:.88s}
.slide.on dl div{animation:rowin .7s both}
.slide.on dl div:nth-child(1){animation-delay:.7s}.slide.on dl div:nth-child(2){animation-delay:.8s}
.slide.on dl div:nth-child(3){animation-delay:.9s}.slide.on dl div:nth-child(4){animation-delay:1s}
.slide.on dl div:nth-child(5){animation-delay:1.1s}.slide.on dl div:nth-child(6){animation-delay:1.2s}
@keyframes rowin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.92);display:none;padding:9vh 6vw;overflow-y:auto}
.ov.on{display:block}
.ov h3{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--hot);font-weight:400;margin-bottom:1.6em}
.ov .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ov button{background:none;border:1px solid var(--rule);color:var(--bone);text-align:left;padding:1em 1.1em;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.25rem;line-height:1;letter-spacing:-.01em;transition:border-color .2s,transform .2s}
.ov button small{display:block;font-family:var(--mono);font-weight:400;letter-spacing:.2em;font-size:.62rem;color:var(--dim);margin-bottom:.9em}
.ov button:hover,.ov button.on{border-color:var(--hot);transform:translateY(-3px)}
.hint{position:fixed;left:52px;bottom:24px;z-index:4;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.hint kbd{border:1px solid var(--rule);padding:.15em .5em;margin:0 .25em;color:var(--bone);font-family:inherit}
.still *,.still *:before{transition:none!important;animation:none!important}
.sn{display:none}
body.notes .slide.on .sn{display:block;position:fixed;left:52px;right:52px;bottom:58px;z-index:7;pointer-events:auto;background:rgba(0,0,0,.86);border:1px solid var(--rule);border-left:2px solid var(--hot);
  padding:1em 1.3em;font-size:clamp(.8rem,1.05vw,.95rem);line-height:1.6;color:var(--bone);max-height:32vh;overflow-y:auto}
.err{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:var(--ink);padding:2em;text-align:center}
@media (max-width:860px){
  .col{width:100%}.slide{justify-content:flex-start;padding-top:11vh;overflow-y:auto}.slide.right .col{margin-left:0}
  dl div{grid-template-columns:6.5em 1fr}.hint{display:none}.nav{right:16px;gap:3px}.nav button{width:14px}
  .slide{padding-left:5vw;padding-right:5vw;padding-bottom:6vh}.col{min-width:0;padding-bottom:2.2em;background:linear-gradient(180deg,rgba(13,16,18,.8) 72%,transparent)}
  p,dd,dt,.kick{overflow-wrap:anywhere}p{max-width:none}
  .no{font-size:3.2rem}h1{font-size:clamp(2.4rem,11vw,4rem)}h2{font-size:clamp(1.7rem,8vw,2.8rem)}
  .hud .l1{display:none}.hud .l2{right:46px}.hud .l3{left:46px;transform:none}
  body.notes .slide.on .sn{left:16px;right:16px;bottom:44px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div><div class="flash" id="flash"></div>
<div class="hud"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
  <span class="l1">{{HUD}}</span><span class="l3" id="auto">▶ auto</span><span class="l2" id="cnt">01 / 01</span></div>
<div class="prog" id="prog"></div>
<div class="nav" id="nav"></div>
<div class="hint">{{HINT}}</div>
<div class="ov" id="ov"><h3>{{OVERVIEW}}</h3><div class="g" id="ovg"></div></div>
<div class="err" id="err">{{ERR}}</div>

{{SLIDES}}

<script src="three.min.js"></script>
<script>
const SPEC={{SPEC_JSON}};
</script>
<script>
(()=>{
if(typeof THREE==='undefined'){document.getElementById('err').style.display='flex';return}
const $=s=>document.querySelector(s), slides=[...document.querySelectorAll('.slide')];
const hx=s=>parseInt(String(s).replace('#',''),16);
const TH=SPEC.theme, HOT=hx(TH.hot), OK=hx(TH.ok), BONE=hx(TH.bone), INK=hx(TH.ink), RULE=hx(TH.rule), DIMC=hx(TH.dim);
const css=n=>'#'+n.toString(16).padStart(6,'0');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), ease=t=>1-Math.pow(1-clamp(t,0,1),3), lerp=(a,b,k)=>a+(b-a)*k;
const TONE={hot:HOT,ok:OK,bone:BONE};
const reduce=false; // la presentación es animación: no se congela con «reducir movimiento»

/* ---------- texto: líneas enmascaradas, números, contadores ---------- */
document.querySelectorAll('h1,h2').forEach(h=>{
  h.innerHTML=h.innerHTML.split(/<br\s*\/?>/i).map((l,i)=>`<span class="ln"><span style="transition-delay:${.28+i*.13}s">${l}</span></span>`).join('');
});
slides.forEach((sl,i)=>{const n=sl.querySelector('.no');if(n)n.textContent=String(i+1).padStart(2,'0')});
const fmt=(v,d)=>v.toFixed(d).replace('.',',');
function countUp(slide){
  slide.querySelectorAll('.cu').forEach(el=>{
    const to=parseFloat(el.dataset.to),d=+(el.dataset.dec||0),t0=performance.now()+500;
    if(reduce){el.textContent=fmt(to,d);return}
    (function f(n){const k=clamp((n-t0)/1300,0,1);el.textContent=fmt(to*ease(k),d);if(k<1&&slide.classList.contains('on'))requestAnimationFrame(f)})(performance.now());
  });
}

/* ---------- escena base ---------- */
const cv=$('#gl'), renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.setClearColor(INK);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(INK,24,70);
const camera=new THREE.PerspectiveCamera(42,1,.1,200);
scene.add(new THREE.HemisphereLight(0xcfd8e0,0x1a1d1f,.75));
const sun=new THREE.DirectionalLight(0xfff1dc,1.1); sun.position.set(8,14,6); scene.add(sun);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:50});sun.shadow.bias=-.0005;
scene.add(new THREE.GridHelper(90,90,RULE,0x181c1f));
const shadowFloor=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.ShadowMaterial({opacity:.45}));
shadowFloor.rotation.x=-Math.PI/2;shadowFloor.position.y=.012;shadowFloor.receiveShadow=true;scene.add(shadowFloor);
let PORTRAIT=false,shift=-.2; // -0.2: texto a la izquierda y escena a la derecha; +0.2 al revés
function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  const port=w<=860;PORTRAIT=port&&h>w;
  camera.fov=PORTRAIT?60:42; /* vertical: texto arriba, escena abajo y más ancha de campo */
  if(!port) camera.setViewOffset(w,h,w*shift,0,w,h); else if(PORTRAIT) camera.setViewOffset(w,h,0,-h*.12,w,h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* ---------- utilidades 3D ---------- */
const M=(c,r=.75,m=.1)=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:r,metalness:m});
const BASE=()=>M(0x20262a,.9,0);
function label(text,size=.5,color=css(BONE)){
  const c=document.createElement('canvas'); c.width=512;c.height=128; const g=c.getContext('2d');
  const tex=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  s.scale.set(size*4,size,1); s.renderOrder=10;
  s.userData.set=(t,col)=>{if(s.userData.t===t&&s.userData.c===col)return;s.userData.t=t;s.userData.c=col;
    g.clearRect(0,0,512,128);let fs=54;const F=()=>g.font='600 '+fs+'px ui-monospace,Menlo,Consolas,monospace';F();
    while(g.measureText(t).width>488&&fs>18){fs-=2;F()}
    g.fillStyle=col||color;g.textAlign='center';g.textBaseline='middle';g.fillText(t,256,64);tex.needsUpdate=true};
  s.userData.set(text,color); return s;
}
const plain=s=>String(s==null?'':s).replace(/<[^>]*>/g,'');
function shape(kind,col,sz=1){
  const mat=M(col);mat.emissive=new THREE.Color(0);
  const G={box:()=>new THREE.BoxGeometry(sz,sz,sz),ico:()=>new THREE.IcosahedronGeometry(sz*.62,0),octa:()=>new THREE.OctahedronGeometry(sz*.7,0),
    cone:()=>new THREE.ConeGeometry(sz*.55,sz*1.2,6),torus:()=>new THREE.TorusGeometry(sz*.45,sz*.16,8,20),cyl:()=>new THREE.CylinderGeometry(sz*.5,sz*.5,sz,7),
    sphere:()=>new THREE.SphereGeometry(sz*.55,14,12),knot:()=>new THREE.TorusKnotGeometry(sz*.38,sz*.12,60,8)};
  const m=new THREE.Mesh((G[kind]||G.ico)(),mat);m.castShadow=true;m.mat=mat;return m;
}
/* partículas compartidas */
const FXN=900,fxP=new Float32Array(FXN*3),fxV=new Float32Array(FXN*3),fxL=new Float32Array(FXN),fxB=new Float32Array(FXN*3),fxC=new Float32Array(FXN*3);
for(let i=0;i<FXN;i++)fxP[i*3+1]=-100;
const fxG=new THREE.BufferGeometry();fxG.setAttribute('position',new THREE.BufferAttribute(fxP,3));fxG.setAttribute('color',new THREE.BufferAttribute(fxC,3));
const fxPts=new THREE.Points(fxG,new THREE.PointsMaterial({size:.2,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
fxPts.frustumCulled=false;scene.add(fxPts);
let fxI=0;
function burst(x,y,z,hex,n=30,sp=4,up=2,life=1){
  const c=new THREE.Color(hex);
  for(let k=0;k<n;k++){const i=(fxI++)%FXN,a=Math.random()*6.283,b=Math.random()*2-1,r=Math.sqrt(1-b*b),s=sp*(.35+Math.random()*.65);
    fxP[i*3]=x;fxP[i*3+1]=y;fxP[i*3+2]=z;fxV[i*3]=Math.cos(a)*r*s;fxV[i*3+1]=b*s*.6+up*Math.random();fxV[i*3+2]=Math.sin(a)*r*s;
    fxL[i]=life*(.6+Math.random()*.4);fxB[i*3]=c.r;fxB[i*3+1]=c.g;fxB[i*3+2]=c.b}
}
function fxUpdate(dt){
  for(let i=0;i<FXN;i++){
    if(fxL[i]<=0){fxP[i*3+1]=-100;continue}
    fxL[i]-=dt*1.5;const l=Math.max(0,fxL[i]);
    fxV[i*3+1]-=7*dt;fxP[i*3]+=fxV[i*3]*dt;fxP[i*3+1]=Math.max(.02,fxP[i*3+1]+fxV[i*3+1]*dt);fxP[i*3+2]+=fxV[i*3+2]*dt;
    fxC[i*3]=fxB[i*3]*l;fxC[i*3+1]=fxB[i*3+1]*l;fxC[i*3+2]=fxB[i*3+2]*l;
  }
  fxG.attributes.position.needsUpdate=true;fxG.attributes.color.needsUpdate=true;
}
/* polvo ambiental */
const DN=260,dp=new Float32Array(DN*3),dg=new THREE.BufferGeometry();
for(let i=0;i<DN;i++){dp[i*3]=(Math.random()-.5)*50;dp[i*3+1]=Math.random()*14;dp[i*3+2]=(Math.random()-.5)*50}
dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dg,new THREE.PointsMaterial({color:DIMC,size:.07,transparent:true,opacity:.55,depthWrite:false}));
dust.frustumCulled=false;scene.add(dust);
const ringMesh=(r0,r1,col,op=1)=>{const m=new THREE.Mesh(new THREE.RingGeometry(r0,r1,64),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;return m};
const pedestal=(w,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,.3,w),BASE());m.position.set(x,y,z);m.receiveShadow=true;return m};
const itemsOf=(d,def)=>(d.items&&d.items.length?d.items:def).map(x=>typeof x==='string'?{label:x}:x);
const V=new THREE.Vector3(),PAL=[HOT,OK,BONE,DIMC,0x6b7680,0x4a545b];
const toneOf=(it,i)=>TONE[it.tone]!=null?TONE[it.tone]:PAL[i%PAL.length];
const poly=(P,u)=>{const f=clamp(u,0,.9999)*(P.length-1),i=Math.floor(f);return V.lerpVectors(P[i],P[i+1],f-i)};
const hit=(o,h)=>{o.userData.hit=h;return o};
const glow=m=>{m.material.emissive=new THREE.Color(0);m.castShadow=true;return m};

/* =====================================================================
   BIBLIOTECA DE ESCENAS — cada una: (g, data, i) => {cam, look, enter?, update(dt,t,s)}
   ===================================================================== */
const SCENES={};

/* orbit: figura central con anillos y satélites (portada / cierre) */
SCENES.orbit=(g,d)=>{
  const core=shape(d.shape||'ico',OK,3);core.scale.setScalar(1.15);core.position.y=2;g.add(core);
  const wire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(2.6,1)),new THREE.LineBasicMaterial({color:RULE}));wire.position.y=2;g.add(wire);
  const rs=[3.6,4.8,6.0].map((r,i)=>{const grp=new THREE.Group();grp.position.y=2;grp.rotation.set(.5+i*.5,0,i*.8);
    const ring=new THREE.Mesh(new THREE.RingGeometry(r,r+.03,96),new THREE.MeshBasicMaterial({color:i?DIMC:HOT,side:THREE.DoubleSide,transparent:true,opacity:.7}));grp.add(ring);
    const sat=shape(['box','octa','cone'][i],i?BONE:HOT,.5);grp.add(sat);g.add(grp);return{grp,sat,r,sp:.5-i*.13}});
  const labs=(d.labels||[]).slice(0,3).map((t,i)=>{const l=label(t,.42,css(i?BONE:HOT));g.add(l);return l});
  const floor=ringMesh(6.4,6.46,HOT,.8);floor.position.y=.02;g.add(floor);
  return{cam:[7,4.2,10],look:[0,1.6,0],update(dt,t){
    core.rotation.y=t*.4;core.rotation.x=Math.sin(t*.3)*.3;core.position.y=2+Math.sin(t*.9)*.15;wire.rotation.y=-t*.15;
    rs.forEach((r,i)=>{r.grp.rotation.z+=dt*.05*(i+1);const a=t*r.sp*2+i*2;r.sat.position.set(Math.cos(a)*r.r,Math.sin(a)*r.r,0);r.sat.rotation.x=t;r.sat.rotation.y=t*1.3;
      const p=new THREE.Vector3();r.sat.getWorldPosition(p);p.sub(g.position);if(labs[i])labs[i].position.set(p.x,p.y+.7,p.z)});
    if(Math.random()<dt*1.2){const a=Math.random()*6.28;burst(Math.cos(a)*6.4,.1,Math.sin(a)*6.4,HOT,6,1.5,2,.8)}
  }};
};

/* bars: barras 3D (positivas = ok, negativas = hot) */
SCENES.bars=(g,d)=>{
  const items=itemsOf(d,[{label:'A',value:3},{label:'B',value:-2},{label:'C',value:5}]);
  const mx=Math.max(...items.map(x=>Math.abs(+x.value)),1),S=3.6/mx,base=4.2,gap=Math.min(1.8,12/items.length),bars=[];
  const plane=new THREE.Mesh(new THREE.BoxGeometry(items.length*gap+1,.04,3),new THREE.MeshBasicMaterial({color:RULE}));plane.position.y=base;g.add(plane);
  items.forEach((it,i)=>{const v=+it.value,x=(i-(items.length-1)/2)*gap;
    const m=new THREE.Mesh(new THREE.BoxGeometry(gap*.66,1,1.3),M(v>=0?OK:HOT));m.castShadow=true;m.material.emissive=new THREE.Color(0);m.position.x=x;g.add(m);bars.push(m);m.userData.hv=0;m.userData.hh=0;m.userData.v=v;
    hit(m,{over:o=>{o.userData.hh=1},out:o=>{o.userData.hh=0},click:o=>{o.userData.pop=1;burst(o.position.x,o.position.y+(o.userData.v>=0?1:-1)*o.scale.y/2,0,o.userData.v>=0?OK:HOT,40,4,3,.9)}})
    const l=label(it.label,.38,css(DIMC));l.position.set(x,base-(v<0?Math.abs(v)*S+.7:.7),0);g.add(l);

      const sett=lt>q.ft+DUR?Math.exp(-(lt-q.ft-DUR)*7)*Math.sin((lt-q.ft-DUR)*20)*.035:0;
      q.pv.rotation.z=-(i===n-1?Math.PI/2:TH)*q.kv-(1-q.kv)*q.hv*.1+sett;
      q.m.material.emissive.setRGB(q.hv*.28,q.hv*.2,q.hv*.08);
      cc.copy(cA).lerp(cB,n>1?i/(n-1):1);q.m.material.color.copy(cOff).lerp(cc,q.kv);
      if(q.l)q.l.userData.set(q.tx,css(q.kv>.5?(i===n-1?HOT:OK):(q.hv>.5?BONE:DIMC)))});
    if(dn&&lt>endT+HOLD)trigger(0);
    const f0=D[0].ft,bu=clamp((lt-(f0-1.2))/1.2,0,1),gone=startJ>0||lt>f0+.5?clamp(1-(lt-f0-.2)/.5,0,1):1;
    ball.position.set(lerp(x0-5,x0-br,bu*bu),br,0);ball.rotation.z=-ball.position.x*2;ball.scale.setScalar(startJ>0?.001:Math.max(.001,gone));
  }};
  trigger(0);

};

/* puzzle: piezas que llegan volando y encajan en un panel (integración, el todo a partir de las partes) */
SCENES.puzzle=(g,d)=>{
  const its=itemsOf(d,['A','B','C','D']).slice(0,9),n=its.length,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),T=Math.min(2.4,6.8/cols),grp=new THREE.Group();grp.position.set(0,4.4,0);g.add(grp);
  const P=its.map((it,i)=>{const c=i%cols,r=Math.floor(i/cols),inRow=r===rows-1?n-r*cols:cols,x=(c-(inRow-1)/2)*T,y=((rows-1)/2-r)*T,grey=TONE[it.tone]==null&&(c+r)%3===2,col=TONE[it.tone]!=null?TONE[it.tone]:[OK,HOT,0x6b7680][(c+r)%3];
    const m=glow(new THREE.Mesh(new THREE.BoxGeometry(T*.94,T*.94,.36),M(col,.6,.1)));grp.add(m);
    const l=label(it.label,clamp(T*.2,.3,.5),css(grey?BONE:INK));l.material.opacity=0;grp.add(l);
    const a=Math.random()*6.283;return{m,l,x,y,sx:Math.cos(a)*(9+Math.random()*4),sy:Math.sin(a)*6,sz:4+Math.random()*8,rx:(Math.random()-.5)*6,ry:(Math.random()-.5)*6}});
  let tl=null,done=false;if(d.label){tl=label(d.label,.5,css(HOT));tl.position.set(0,rows*T/2+.9,0);tl.material.opacity=0;grp.add(tl)}
  const CY=.6+n*.28+.9+6;
  return{cam:[0,5.2,14.5],look:[0,4.3,0],enter(){done=false},update(dt,t,s){
    const ct=s%CY,out=clamp((ct-(CY-1))/1,0,1);let all=true;
    P.forEach((q,i)=>{const u=clamp((ct-.4-i*.28)/.9,0,1),k=ease(u)*(1-out*out);if(u<1)all=false;
      q.m.position.set(lerp(q.sx,q.x,k),lerp(q.sy,q.y,k),lerp(q.sz,0,k));q.m.rotation.set(q.rx*(1-k),q.ry*(1-k),0);
      q.l.position.set(q.m.position.x,q.m.position.y,q.m.position.z+.3);q.l.material.opacity=k>.97?1:0;
      const f=done?Math.max(0,1-Math.abs(((t*1.2)%(n+2))-i)):0;q.m.material.emissive.setRGB(f*.25,f*.2,f*.1)});
    if(all&&!done&&out===0){done=true;grp.getWorldPosition(V);burst(V.x,V.y,.5,BONE,50,5,3,1)}if(!all)done=false;
    if(tl)tl.material.opacity=done&&out===0?1:0;grp.rotation.y=Math.sin(t*.35)*.2;
  }};
};

/* shield: núcleo protegido por un escudo que bloquea ataques (seguridad, resiliencia, defensa) */
SCENES.shield=(g,d)=>{
  const RED=0xff4d4d,R=3,C=new THREE.Vector3(0,3.8,0),Z=new THREE.Vector3(0,0,1),core=shape(d.shape||'ico',OK,1.8);core.position.copy(C);g.add(core);
  const wf=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(R,2)),new THREE.LineBasicMaterial({color:OK,transparent:true,opacity:.35}));wf.position.copy(C);g.add(wf);
  const sk=new THREE.Mesh(new THREE.SphereGeometry(R*.99,32,24),new THREE.MeshBasicMaterial({color:OK,transparent:true,opacity:.06,depthWrite:false}));sk.position.copy(C);g.add(sk);
  if(d.label){const l=label(d.label,.46);l.position.set(0,C.y+R+.8,0);g.add(l)}
  const cnt=label('',.5,css(OK));cnt.position.set(0,.3,3.4);g.add(cnt);
  const fr=ringMesh(3.6,3.66,OK,.7);fr.position.y=.02;g.add(fr);
  const th=(d.threats||[]).slice(0,3),rs=()=>{const a=Math.random()*6.283,y=-.15+Math.random()*1.05,v=new THREE.Vector3(Math.cos(a),y,Math.sin(a)).normalize();return v};
  const A=Array.from({length:clamp(Math.round(+d.count||6),1,12)},(_,i)=>{const m=shape('octa',RED,.5);g.add(m);let l=null;if(th[i]){l=label(th[i],.34,css(RED));g.add(l)}return{m,l,dir:rs(),dist:6+i*2.2,sp:2.4+Math.random()*2.4}});
  const rip=Array.from({length:4},()=>{const m=new THREE.Mesh(new THREE.RingGeometry(.3,.38,32),new THREE.MeshBasicMaterial({color:BONE,transparent:true,opacity:0,side:THREE.DoubleSide}));g.add(m);return{m,age:9}});
  let n=0,flash=0,ri=0;
  return{cam:[5.5,5.5,12.5],look:[0,3.6,0],enter(){n=0},update(dt,t){
    A.forEach(a=>{a.dist-=a.sp*dt;if(a.dist<=R){const p=V.copy(a.dir).multiplyScalar(R).add(C);burst(p.x,p.y,p.z,RED,18,3,1.5,.6);flash=1;n++;
        const r=rip[ri++%4];r.age=0;r.m.position.copy(p);r.m.quaternion.setFromUnitVectors(Z,a.dir);a.dir=rs();a.dist=9+Math.random()*5;a.sp=2.4+Math.random()*2.4}
      a.m.position.copy(a.dir).multiplyScalar(a.dist).add(C);a.m.rotation.x=t*3;a.m.rotation.y=t*2;if(a.l)a.l.position.set(a.m.position.x,a.m.position.y+.6,a.m.position.z)});
    rip.forEach(r=>{r.age+=dt;const k=clamp(r.age/.7,0,1);r.m.scale.setScalar(1+k*4);r.m.material.opacity=k<1?(1-k)*.9:0});
    flash=Math.max(0,flash-dt*3);wf.material.opacity=.3+flash*.6;sk.material.opacity=.05+flash*.14;wf.rotation.y=t*.15;
    core.rotation.y=t*.5;core.scale.setScalar(1+Math.sin(t*2)*.04);core.mat.emissive.setRGB(flash*.1,flash*.3,flash*.15);
    cnt.userData.set(d.unit?n+' '+d.unit:'× '+n,css(OK));
  }};
};

/* rocket: cohete que despega y atraviesa hitos (lanzamiento, crecimiento, objetivos por alcanzar) */
SCENES.rocket=(g,d)=>{
  const its=itemsOf(d,[]).slice(0,5),n=its.length,rk=new THREE.Group();g.add(rk);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.42,.48,1.7,12),M(BONE,.5,.2));body.position.y=.85;
  const nose=new THREE.Mesh(new THREE.ConeGeometry(.42,.9,12),M(HOT,.5,.1));nose.position.y=2.15;
  const noz=new THREE.Mesh(new THREE.CylinderGeometry(.25,.38,.3,10),BASE());noz.position.y=-.1;rk.add(body,nose,noz);
  for(let k=0;k<3;k++){const f=new THREE.Mesh(new THREE.BoxGeometry(.08,.7,.6),M(HOT,.5,.1)),a=k/3*Math.PI*2;f.position.set(Math.cos(a)*.55,.3,Math.sin(a)*.55);f.rotation.y=Math.PI/2-a;rk.add(f)}
  rk.traverse(o=>{if(o.isMesh)o.castShadow=true});g.add(pedestal(2.6,0,.15,0));
  const ms=its.map((it,i)=>{const y=n===1?5.5:3+i*(5.5/(n-1)),r=ringMesh(1.3,1.36,DIMC,.8);r.position.y=y;g.add(r);
    const l=label(it.label,.44);l.position.set(3.3,y+(it.sub?.18:0),0);g.add(l);if(it.sub){const s2=label(it.sub,.3,css(DIMC));s2.position.set(3.3,y-.3,0);g.add(s2)}return{r,l,y,tx:it.label,on:false,age:9}});
  let prev=0;
  return{cam:[3.5,5.2,16],look:[1.2,4.8,0],update(dt,t,s){
    const ct=s%9;if(ct<prev)ms.forEach(m=>m.on=false);prev=ct;
    const u=clamp((ct-1.4)/4.6,0,1),y=.3+u*u*13,x=Math.sin(u*3)*.5,sh=ct>.5&&ct<1.4?.04:0;
    rk.position.set(x+(Math.random()-.5)*sh,y+(Math.random()-.5)*sh,0);rk.rotation.z=-Math.cos(u*3)*.14*u;rk.rotation.y=t*.4;rk.scale.setScalar(ct<.4?Math.max(.001,ease(ct/.4)):1);rk.visible=ct<6.2;
    if(ct>.5&&ct<6)burst(x,y-.1,0,ct<1.4?BONE:HOT,3,1.2,0,.6);
    ms.forEach(m=>{const on=ct>=1.4&&y+1>=m.y;if(on&&!m.on){m.age=0;burst(x,m.y,0,OK,24,3.5,2,.8)}m.on=on;m.age+=dt;const k=clamp(m.age/.8,0,1);
      m.r.material.color.setHex(on?OK:DIMC);m.r.scale.setScalar(1+(k<1?Math.sin(k*Math.PI)*.5:0));m.l.userData.set(m.tx,css(on?OK:BONE))});
  }};
};

/* ---------- animaciones de entrada del grupo 3D (spec.intro o slide.intro) ---------- */
const INTRO={none:null,rise(w,k){w.position.y=(k-1)*7},drop(w,k){w.position.y=(1-k)*11},zoom(w,k){w.scale.setScalar(.001+k*.999)},
  spin(w,k){w.rotation.y=(1-k)*Math.PI*1.5;w.scale.setScalar(.3+k*.7)},slide(w,k){w.position.x=(1-k)*22*(shift<0?1:-1)},
  flip(w,k){w.rotation.x=(1-k)*-Math.PI/2;w.position.y=(1-k)*3}};
const INTROS=['rise','zoom','spin','drop','slide','flip'];

/* escenas que se reparten cuando una diapositiva no indica `scene` */
const AUTO=['flow','bars','stairs','cards','timeline','hub','donut','pyramid','gears','layers'];

/* ---------- instanciar una escena por diapositiva ---------- */
const SC=[];
SPEC.slides.forEach((sd,i)=>{
  const w=new THREE.Group();let g=new THREE.Group();w.visible=false;w.add(g);scene.add(w);
  const kind=SCENES[sd.scene]?sd.scene:(i===0?'orbit':AUTO[i%AUTO.length]);
  let made;
  /* una escena que falla al construirse no debe dejar la presentación en negro: se sustituye por orbit y se avisa en consola */
  try{made=SCENES[kind](g,sd.data||{})}
  catch(e){console.error('[presentacion-3d] slide '+(i+1)+': la escena "'+kind+'" ha falladoal construirse',e);w.remove(g);g=new THREE.Group();w.add(g);made=SCENES.orbit(g,{})}
  const o=Object.assign({cam:[0,6,16],look:[0,2,0],enter(){},update(){}},made);o.kind=kind;
  let it=sd.intro||SPEC.intro||'none';if(it==='auto')it=INTROS[i%INTROS.length];o.intro=INTRO[it]||null;
  if(sd.cam)o.cam=sd.cam;if(sd.look)o.look=sd.look;o.group=w;SC.push(o);
});

/* ---------- cámara y navegación ---------- */
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(0,1,0),tp=new THREE.Vector3(),tl=new THREE.Vector3();
let cur=-1,tIn=0,mx=0,my=0,auto=false;
/* interacción: los objetos marcados con hit(obj,{over,out,click}) reaccionan al ratón */
const RC=new THREE.Raycaster(),NDC=new THREE.Vector2();let hov=null,pdirty=false,pe=null;
const hitOf=o=>{while(o){if(o.userData&&o.userData.hit)return o;o=o.parent}return null};
function pick(e){
  if(cur<0||e.target.closest&&e.target.closest('.col,button,.ov'))return null;
  NDC.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);RC.setFromCamera(NDC,camera);
  const hs=RC.intersectObjects(SC[cur].group.children,true);
  for(const h of hs){if(!h.object.visible)continue;const o=hitOf(h.object);if(o)return o}return null;
}
function setHover(o){
  if(o===hov)return;
  if(hov&&hov.userData.hit.out)try{hov.userData.hit.out(hov)}catch(e){}
  hov=o;if(o&&o.userData.hit.over)try{o.userData.hit.over(o)}catch(e){}
  document.body.style.cursor=o?'pointer':'';
}
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;pe=e;pdirty=true});
addEventListener('click',e=>{const o=pick(e);if(o&&o.userData.hit.click)try{o.userData.hit.click(o)}catch(er){console.error('[presentacion-3d] click',er)}});
const ovg=$('#ovg'),ov=$('#ov'),nav=$('#nav');
slides.forEach((s,i)=>{
  const b=document.createElement('button'),hd=s.querySelector('h1,h2');
  b.innerHTML=`<small>${String(i+1).padStart(2,'0')}</small>${(hd?hd.innerText:'').replace(/\s+/g,' ')}`;
  b.onclick=()=>{ov.classList.remove('on');go(i)};ovg.appendChild(b);
  const n=document.createElement('button');n.setAttribute('aria-label','Slide '+(i+1));n.onclick=()=>go(i);nav.appendChild(n);
});
function go(i){
  i=clamp(i,0,slides.length-1);if(i===cur)return;cur=i;
  slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  [...nav.children].forEach((b,k)=>b.classList.toggle('on',k===i));
  setHover(null);SC.forEach((o,k)=>o.group.visible=(k===i));
  const ns=slides[i].classList.contains('right')?.2:-.2;if(ns!==shift){shift=ns;resize()}
  try{SC[i].enter()}catch(e){console.error('[presentacion-3d] slide '+(i+1)+': enter() falló',e)}
  tIn=performance.now();countUp(slides[i]);
  const fl=$('#flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
  $('#cnt').textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  $('#prog').style.width=((i+1)/slides.length*100)+'%';history.replaceState(null,'','#'+(i+1));
}
function placeCamera(){
  const zf=Math.max(1,innerWidth>860?1.75/camera.aspect:1.1/(camera.aspect*.95)/(Math.tan(camera.fov*Math.PI/360)/Math.tan(21*Math.PI/180))),cx=camLook.x+(camPos.x-camLook.x)*zf,cy=camLook.y+(camPos.y-camLook.y)*zf,cz=camLook.z+(camPos.z-camLook.z)*zf; /* pantallas poco anchas: la cámara se aleja para que no se recorte el lado derecho */
  camera.position.set(cx+mx*1.4+Math.sin(T*.15)*.5,cy-my*.9+Math.sin(T*.11)*.25,cz);camera.lookAt(camLook);
}
let last=performance.now(),T=0;
function frame(now){
  /* el primer rAF puede traer una marca de tiempo anterior a performance.now(): sin el clamp, dt y since salen negativos */
  const dt=clamp((now-last)/1000,0,.05);last=now;T+=dt;
  const o=SC[cur],since=Math.max(0,(now-tIn)/1000);
  /* un error dentro de una escena se registra una vez y esa escena se congela; el resto sigue pintándose */
  if(!o.bad){try{o.update(dt,T,since)}catch(e){o.bad=true;console.error('[presentacion-3d] slide '+(cur+1)+': la escena "'+o.kind+'" ha falladoal animarse',e)}}
  fxUpdate(dt);
  if(pdirty){pdirty=false;setHover(pick(pe))}
  if(o.intro){const w=o.group;w.position.set(0,0,0);w.rotation.set(0,0,0);w.scale.setScalar(1);if(since<1.2)o.intro(w,ease(since/1.1))}
  for(let i=0;i<DN;i++){dp[i*3+1]+=dt*.25;if(dp[i*3+1]>14)dp[i*3+1]=0;dp[i*3]+=Math.sin(T*.2+i)*dt*.12}
  dg.attributes.position.needsUpdate=true;
  tp.set(...o.cam);tl.set(...o.look);
  const k=1-Math.exp(-dt*2.4);camPos.lerp(tp,k);camLook.lerp(tl,k);
  placeCamera();
  renderer.render(scene,camera);
  if(auto&&since>(SPEC.autoSeconds||15))go(cur+1>=slides.length?0:cur+1);
  requestAnimationFrame(frame);
}
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);
  else if(e.key==='o'||e.key==='O'){ov.classList.toggle('on');[...ovg.children].forEach((b,k)=>b.classList.toggle('on',k===cur))}
  else if(e.key==='Escape')ov.classList.remove('on');
  else if(e.key==='p'||e.key==='P'){auto=!auto;$('#auto').classList.toggle('on',auto)}
  else if(e.key==='n'||e.key==='N')document.body.classList.toggle('notes')
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1))},{passive:true});
$('#cnt').addEventListener('click',()=>go(0));
const first=clamp((parseInt(location.hash.slice(1))||1)-1,0,slides.length-1);
camPos.set(...SC[first].cam).add(new THREE.Vector3(0,4,8));
go(first);
/* ---------- ayudas para comprobar (scripts/check.py) ----------
   ?selftest  simula 30 s de cada escena sin pintar y escribe el resultado en la consola
   ?shot      adelanta 6 s la diapositiva actual y quita transiciones, para capturas representativas */
const Q=new URLSearchParams(location.search);
window.__selftest=()=>{let bad=0;
  SC.forEach((o,i)=>{try{o.enter();for(let k=0;k<1500;k++)o.update(.02,k*.02+i,k*.02)}
    catch(e){bad++;console.error('[presentacion-3d] slide '+(i+1)+': la escena "'+o.kind+'" ha falladoen la simulación',e)}});
  console.log('[presentacion-3d] selftest: '+SC.length+' escenas, '+bad+' con errores');return bad};
if(Q.has('selftest'))window.__selftest();
if(Q.has('shot')){document.documentElement.classList.add('still');const o=SC[cur];
  const secs=parseFloat(Q.get('shot'))||6; /* ?shot=3.4 simula 3,4 s desde la entrada (para grabar GIF fotograma a fotograma) */
  for(let k=0;k<Math.round(secs/.02);k++){T+=.02;try{o.update(.02,T,k*.02)}catch(e){}fxUpdate(.02)}
  tIn=performance.now()-secs*1000;camPos.set(...o.cam);camLook.set(...o.look)}
requestAnimationFrame(frame);
/* __frame(i,secs): devuelve un fotograma JPEG (solo la escena) de la diapositiva i, secs segundos tras entrar. Sirve para montar GIF. */
window.__frame=(i,secs,q=.9)=>{go(i);if(shift!==0){shift=0;resize()}const o=SC[i];mx=my=0;let tt=0;T=0; /* T=0: el tiempo global empieza en cero para que los fotogramas sean continuos */
  for(let k=0;k<Math.round(secs/.02);k++){tt+=.02;T+=.02;try{o.update(.02,T,k*.02)}catch(e){}fxUpdate(.02)}
  camPos.set(...o.cam);camLook.set(...o.look);placeCamera();renderer.render(scene,camera);return renderer.domElement.toDataURL('image/jpeg',q)};
window.__go=go;
})();
</script>
